<!doctype html>
<html lang="pl" class="dark">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon-180.png" />
		<meta name="theme-color" content="#121a1d" />
		<meta
			name="description"
			content="Trójwymiarowa wikipedia świata Gothic: przedmioty, postacie i ich miejsca na mapie 3D."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="GIS of Gothic" />
		<meta property="og:locale" content="pl_PL" />
		<meta property="og:title" content="GIS of Gothic" />
		<meta
			property="og:description"
			content="Trójwymiarowa wikipedia świata Gothic: przedmioty, postacie i ich miejsca na mapie 3D."
		/>
		<meta property="og:url" content="https://gisofgothic.dworecki.dev" />
		<meta
			property="og:image"
			content="https://raw.githubusercontent.com/MDworecki404/GisOfGothic/main/screenshot.png"
		/>
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="apple-mobile-web-app-title" content="GIS of Gothic" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script src="%sveltekit.assets%/theme-init.js"></script>
		<style>
			html {
				--splash-background: #121a1d;
				--splash-accent: #c4a15f;
				background: var(--splash-background);
			}
			html[data-theme='light'] {
				--splash-background: #b6c4c2;
				--splash-accent: #586b10;
			}
			#app-splash {
				position: fixed;
				inset: 0;
				z-index: 99;
				display: grid;
				place-items: center;
				background: var(--splash-background);
				color: var(--splash-accent);
				font:
					600 1.75rem/1.1 Georgia,
					serif;
			}
			#app-splash i {
				display: block;
				width: 22px;
				height: 22px;
				margin: 1rem auto 0;
				border: 3px solid var(--splash-accent);
				border-top-color: transparent;
				border-radius: 50%;
				animation: app-splash-spin 0.9s linear infinite;
			}
			@keyframes app-splash-spin {
				to {
					transform: rotate(360deg);
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#app-splash i {
					animation: none;
					border-top-color: var(--splash-accent);
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app-splash" role="status" aria-label="Wczytywanie aplikacji">
			<div style="text-align: center">GIS of Gothic<i></i></div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
