name: Błąd w danych
description: Zły opis, miejsce, poziom albo brakujący wpis
title: 'Dane: '
labels: ['dane']
body:
  - type: markdown
    attributes:
      value: Dane pochodzą z ekstrakcji z gier. Nie dołączaj plików ani zasobów z gry, wystarczy opis.
  - type: textarea
    id: description
    attributes:
      label: Co jest nie tak?
      description: Podaj nazwę wpisu (przedmiot, postać, quest), świat i co powinno być zamiast tego.
    validations:
      required: true
  - type: input
    id: view_link
    attributes:
      label: Link do widoku
      description: Przycisk „Kopiuj link” w aplikacji odtwarza świat, wpis i kamerę.
